name: soak-windows
# Real soak, Windows side (benchmark/fleet/soak-real.md): one `pqcscan agent --once` per runner image per night
# against the soak collector. Identity is pinned (MachineGuid) and the state dir (agent.token, spool, agent.db)
# carries over between runs through the Actions cache, encrypted, so each image is one fleet host for the whole soak.
# GitHub runs schedule and workflow_dispatch only from the default branch's copy of this file; the code under
# test is the commit in the repository variable SOAK_REF, checked out below.
# Secrets: SOAK_SERVER_URL, SOAK_ENROLL_TOKEN, SOAK_CA_PEM (from ~/.config/pqc-soak/env), SOAK_STATE_KEY (the key
# the cached state dir is encrypted with); see soak-real.md.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      # Every input up front: an empty enroll token would also turn the agent.log scrub below into garbage.
      - name: Require SOAK_REF and the soak secrets
        env:
          SOAK_REF: ${{ vars.SOAK_REF }}
          SOAK_SERVER_URL: ${{ secrets.SOAK_SERVER_URL }}
          SOAK_ENROLL_TOKEN: ${{ secrets.SOAK_ENROLL_TOKEN }}
          SOAK_CA_PEM: ${{ secrets.SOAK_CA_PEM }}
          SOAK_STATE_KEY: ${{ secrets.SOAK_STATE_KEY }}
        run: |
          if (-not $env:SOAK_REF) { throw "repository variable SOAK_REF is not set (gh variable set SOAK_REF)" }
          $missing = 'SOAK_SERVER_URL', 'SOAK_ENROLL_TOKEN', 'SOAK_CA_PEM', 'SOAK_STATE_KEY' |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "repository secret(s) not set: $($missing -join ', ') (see benchmark/fleet/soak-real.md)" }

      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.SOAK_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: pip install -e ".[build]"

      # Same as release.yml "Build (Windows)": the release spec, so the soak runs the binary users download.
      - name: Build (release spec)
        run: |
          pyinstaller --clean --noconfirm `
            --workpath build/pqcscan-work `
            build/pyinstaller.spec
          if (-not (Test-Path "dist/pqcscan.exe")) {
            throw "build did not produce dist/pqcscan.exe"
          }
          & "dist/pqcscan.exe" --help | Out-Null

      # pqcscan hashes MachineGuid into the host's machine id; a fresh runner VM has a new one every run.
      - name: Pin machine identity
        run: |
          Set-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\Cryptography -Name MachineGuid -Value '${{ matrix.os == 'windows-2022' && '6b1f0c2e-0000-4000-8000-000000002022' || '6b1f0c2e-0000-4000-8000-000000002025' }}'
          Get-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\Cryptography -Name MachineGuid | Select-Object MachineGuid

      # The state dir holds agent.token, the spool and the scan DB. Any workflow in this public repo can restore
      # this repo's caches, so only an AES-256 encrypted tarball of it goes into the cache (key: secret SOAK_STATE_KEY).
      # tar is Windows' bundled bsdtar (takes C:\ paths); openssl is Git for Windows'.
      - name: Check tar, openssl and SOAK_STATE_KEY
        env:
          SOAK_STATE_KEY: ${{ secrets.SOAK_STATE_KEY }}
        run: |
          $tar = "$env:SystemRoot\System32\tar.exe"
          $openssl = "C:\Program Files\Git\usr\bin\openssl.exe"
          foreach ($t in $tar, $openssl) { if (-not (Test-Path $t)) { throw "missing $t on this runner image" } }
          if (-not $env:SOAK_STATE_KEY) { throw "secret SOAK_STATE_KEY is not set (openssl rand -hex 32)" }
          & $openssl version
          "SOAK_TAR=$tar" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SOAK_OPENSSL=$openssl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\pqc-state.tar.gz.enc
          key: soak-state-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: soak-state-${{ matrix.os }}-

      # Nothing restored (first night): the agent enrolls. Restored but undecryptable: fail, never re-enroll quietly.
      - name: Decrypt state dir
        env:
          SOAK_STATE_KEY: ${{ secrets.SOAK_STATE_KEY }}
        run: |
          $enc = "$env:RUNNER_TEMP\pqc-state.tar.gz.enc"; $tgz = "$env:RUNNER_TEMP\pqc-state.tar.gz"
          if (-not (Test-Path $enc)) { "no cached state: this run enrolls"; exit 0 }
          & $env:SOAK_OPENSSL enc -d -aes-256-cbc -pbkdf2 -salt -pass env:SOAK_STATE_KEY -in $enc -out $tgz
          if ($LASTEXITCODE) { throw "decrypting the cached state failed (wrong SOAK_STATE_KEY?)" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\pqc-state" | Out-Null
          & $env:SOAK_TAR -xzf $tgz -C "$env:RUNNER_TEMP\pqc-state"
          if ($LASTEXITCODE) { throw "unpacking the cached state failed" }
          Remove-Item $tgz

      - name: Write CA
        env:
          SOAK_CA_PEM: ${{ secrets.SOAK_CA_PEM }}
        run: |
          if (-not $env:SOAK_CA_PEM) { throw "secret SOAK_CA_PEM is not set" }
          Set-Content -Path ca.pem -Value $env:SOAK_CA_PEM -Encoding ascii

      - name: Jitter (up to 30 min)
        run: Start-Sleep -Seconds (Get-Random -Maximum 1800)

      - name: pqcscan agent --once
        env:
          SOAK_SERVER_URL: ${{ secrets.SOAK_SERVER_URL }}
          SOAK_ENROLL_TOKEN: ${{ secrets.SOAK_ENROLL_TOKEN }}
        run: |
          # agent.log is a public artifact and the job log is public: neither may carry the collector's URL or IP.
          # GitHub masks only the whole secret string, so the bare host is masked here as well.
          $server = $env:SOAK_SERVER_URL.TrimEnd('/'); $serverHost = ([uri]$server).Host
          if (-not $serverHost) { throw "SOAK_SERVER_URL has no host part" }
          Write-Output "::add-mask::$serverHost"
          $ErrorActionPreference = 'Continue'   # loguru writes to stderr; that is output, not a failure
          dist\pqcscan.exe agent --once --server $env:SOAK_SERVER_URL --enroll-token $env:SOAK_ENROLL_TOKEN --ca-cert ca.pem --labels env=soak,os=windows,runner=${{ matrix.os }} --state-dir $env:RUNNER_TEMP\pqc-state 2>&1 | Tee-Object agent.log
          $code = $LASTEXITCODE
          # Artifacts are not masked: scrub the enroll token, the SOAK_SERVER_URL and its bare host before upload.
          (Get-Content agent.log) -replace [regex]::Escape($env:SOAK_ENROLL_TOKEN), '<enroll-token>' `
            -replace [regex]::Escape($server), '<server>' -replace [regex]::Escape($serverHost), '<server>' |
            Set-Content agent.log
          exit $code

      # Runs after a failed agent too: the token and the spool must survive to the next night.
      - name: Encrypt state dir
        id: encrypt
        if: always()
        env:
          SOAK_STATE_KEY: ${{ secrets.SOAK_STATE_KEY }}
        run: |
          $state = "$env:RUNNER_TEMP\pqc-state"
          $enc = "$env:RUNNER_TEMP\pqc-state.tar.gz.enc"; $tgz = "$env:RUNNER_TEMP\pqc-state.tar.gz"
          if (-not (Test-Path $state)) { throw "no state dir to save: the agent did not run" }
          & $env:SOAK_TAR -czf $tgz -C $state .
          if ($LASTEXITCODE) { throw "packing the state dir failed" }
          & $env:SOAK_OPENSSL enc -aes-256-cbc -pbkdf2 -salt -pass env:SOAK_STATE_KEY -in $tgz -out $enc
          if ($LASTEXITCODE) { throw "encrypting the state dir failed" }
          Remove-Item $tgz

      - uses: actions/cache/save@v4
        if: always() && steps.encrypt.outcome == 'success'
        with:
          path: ${{ runner.temp }}\pqc-state.tar.gz.enc
          key: soak-state-${{ matrix.os }}-${{ github.run_id }}

      - name: List state dir
        if: always()
        run: Get-ChildItem -Recurse -Force "$env:RUNNER_TEMP\pqc-state" | Format-Table -AutoSize FullName, Length, LastWriteTimeUtc | Out-String -Width 400 | Set-Content state-listing.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.os }}-${{ github.run_id }}
          path: |
            agent.log
            state-listing.txt
          retention-days: 30
