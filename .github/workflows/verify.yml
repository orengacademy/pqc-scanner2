name: verify
# Evidence jobs for the fleet claims: the fleet tests on PostgreSQL, the Windows installer on real runners,
# the ingest fuzzers, the load and soak smoke tests, and the probe accuracy gate. Not a release gate; ci.yml remains the merge gate.
on:
  push:
    branches: ["verify/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    # The fleet store, daemon and spool tests, with every tmp_db_path being a fresh PostgreSQL database.
    # test_db_dialect.py runs first. PQCSCAN_REQUIRE_POSTGRES makes it fail, not skip, when the URL variable is
    # missing, and it fails when the fixture yields anything but PostgreSQL; a wrong URL fails at connect.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pqc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PQCSCAN_TEST_DB_URL: postgresql+psycopg://postgres:pqc@localhost:5432/postgres
      PQCSCAN_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,verify]"
      - name: Fleet tests on PostgreSQL
        run: >-
          pytest -q -ra
          tests/unit/test_db_dialect.py
          tests/unit/test_fleet_schema.py
          tests/unit/test_fleet_repo.py
          tests/unit/test_daemon_fleet.py
          tests/unit/test_parity_drift.py
          tests/unit/test_fleet_threat_model_gaps.py
          tests/unit/test_daemon_guard.py
          tests/integration/test_daemon_api.py
          tests/integration/test_fleet_spool.py

  windows-installer:
    # packaging/fleet/windows-task.ps1 as shipped: downloads the pinned v0.10.2 asset, checks its SHA-256,
    # registers the scheduled task. The installer needs Windows PowerShell 5.1 (Desktop) and an elevated
    # administrator; GitHub's Windows runners are both. windows-2022 and windows-latest, not Server 2019.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Pester 5
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = "packaging/fleet/windows-task.Tests.ps1"
          $c.Run.Exit = $true
          $c.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $c

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PQCSCAN_FUZZ_EXAMPLES: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,verify]"
      - run: pytest tests/fuzz -m fuzz -q -ra

  bench-smoke:
    # The load and soak harnesses end to end at toy size. The load test needs locust (the verify extra), so it
    # skips in ci.yml, which installs only dev and render; here it runs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,verify]"
      - run: pytest -q -ra tests/benchmark/test_fleet_load_smoke.py tests/benchmark/test_fleet_soak_smoke.py

  accuracy:
    # The runner's Python links OpenSSL 3.0, so the hybrid-KEM endpoint cases record SKIP, as docs/ACCURACY.md
    # describes; the gate numbers cover everything that ran.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Accuracy benchmark
        run: python benchmark/run_benchmark.py --by-family --accept-fp-file benchmark/corpus/accepted_fp.txt --min-precision 1.0 --min-recall 0.95
      - name: Accuracy gate
        run: pytest -q -ra tests/benchmark/test_accuracy.py

  load-ratio:
    # Same-runner A/B: the load harness at 120 hosts, 60 s interval (2 posts/s), 1,670-finding bundles, 90 s, on
    # SQLite and Postgres, once from the baseline commit (PR #92 head, checked out into baseline/) and once from HEAD.
    # Fails when HEAD p95 exceeds both 1.5 x baseline and 1 s. Postgres runs in a container the harness starts itself
    # (docker is on ubuntu-latest). The baseline harness has no --rate, so both sides use --interval 60. run_load exits
    # 1 when p95 >= 2 s; the pipe to tail swallows that on purpose, because ratio.py is the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_REF: 77867a1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv-head && .venv-head/bin/pip install -e ".[dev,verify]"
      - run: python -m venv .venv-base && .venv-base/bin/pip install -e "./baseline[dev,verify]"
      - name: Run both on both backends
        run: |
          set -e
          for db in sqlite postgres; do
            (cd baseline && ../.venv-base/bin/python -m benchmark.fleet.run_load --db $db --hosts 120 --interval 60 --duration 90s --findings-per-bundle 1670 --tag ci-base | tail -1 >/dev/null)
            .venv-head/bin/python -m benchmark.fleet.run_load --db $db --hosts 120 --interval 60 --duration 90s --findings-per-bundle 1670 --tag ci-head | tail -1 >/dev/null
            base=$(ls -t baseline/benchmark/fleet/results/load-$db-*-ci-base*.json | head -1)
            head=$(ls -t benchmark/fleet/results/load-$db-*-ci-head*.json | head -1)
            .venv-head/bin/python -m benchmark.fleet.ratio "$base" "$head" --max-ratio 1.5 --floor-ms 1000
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-ratio-results
          path: |
            benchmark/fleet/results/*ci-*.json
            baseline/benchmark/fleet/results/*ci-*.json
