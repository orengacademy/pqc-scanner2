# ---- TLS endpoints (local 127.0.0.1 servers from endpoint.yaml) ------------
# net.tls.versions: positive when <= TLS 1.1 is accepted or TLS 1.3 is absent.
# net.tls.kex_groups / pqc_handshake: TLS 1.3 key_share; classical group ->
#   positive, hybrid ML-KEM -> negative.
# net.tls.cert_chain reads the TLS <= 1.2 Certificate message;
#   net.tls.cert_chain_tls13 decrypts the TLS 1.3 one.
# net.tls.https: negotiated suite + leaf cert via the OS ssl client. It has no
#   negative: every TLS 1.3 suite classifies rendah/sederhana (a detection
#   tier), so even a fully-PQC endpoint "fires" (see docs/ACCURACY.md).
- id: ep-tls10-versions
  probe: net.tls.versions
  kind: positive
  fixture: endpoint
  input: cases/endpoint-tls10-only/endpoint.yaml
  expect: {algorithm_contains: TLS 1.0, min_severity: high}
- id: ep-tls10-cert-chain
  probe: net.tls.cert_chain
  kind: positive
  fixture: endpoint
  input: cases/endpoint-tls10-only/endpoint.yaml
  expect: {algorithm_contains: RSA-2048}
- id: ep-tls10-https
  probe: net.tls.https
  kind: positive
  fixture: endpoint
  input: cases/endpoint-tls10-only/endpoint.yaml
  expect: {algorithm_contains: RSA-2048}
- id: ep-rsa-kex-versions
  probe: net.tls.versions
  kind: positive
  fixture: endpoint
  input: cases/endpoint-rsa-kex-only/endpoint.yaml
  expect: {algorithm_contains: TLS 1.3}
- id: ep-rsa-kex-cert-chain
  probe: net.tls.cert_chain
  kind: positive
  fixture: endpoint
  input: cases/endpoint-rsa-kex-only/endpoint.yaml
  expect: {algorithm_contains: RSA-2048}
- id: ep-rsa-kex-https         # static-RSA key transport suite must itself be flagged
  probe: net.tls.https
  kind: positive
  fixture: endpoint
  input: cases/endpoint-rsa-kex-only/endpoint.yaml
